version: '3'
services:
  fdca-intranet:
    build:
      context: ./fdca-intranet
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT
        - AZURE_CLIENT_ID
        - AZURE_TENANT_ID
        - AZURE_CLIENT_SECRET
        - AZURE_SUBSCRIPTION_ID
        - ORIGIN
    ports:
      - 3000:3000
    env_file:
      - .env
    