name: CI/CD Pipeline with OIDC

on:
  push:
    branches:
      - test

permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      # Cache npm dependencies
      - name: Cache npm dependencies
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup Buildx cache
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry for cache
        uses: docker/login-action@v3
        with:
          registry: sagalabspackages.azurecr.io
          username: d11d2765-c1c4-4963-b46d-a837eec38f7d #Service principal application ID
          password: ${{ secrets.AZURE_FDCA_CONTAINER_REPO }} # Service principal password

      - name: Create .env file
        run: echo "${{ vars.testenv }}" > fdca-intranet/.env

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build, Tag, and Push Docker Image with Cache
        uses: docker/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          tags: sagalabspackages.azurecr.io/sagalabs/fdca-intranet-test:${{ github.sha }}
          push: true
          cache-from: type=registry,ref=sagalabspackages.azurecr.io/sagalabs/fdca-intranet-test:cache
          cache-to: type=registry,ref=sagalabspackages.azurecr.io/sagalabs/fdca-intranet-test:cache,mode=max

      - name: Update Deployment YAML to current tag
        run: |
          sed -i 's|sagalabspackages.azurecr.io/sagalabs/fdca-intranet-test:latest|sagalabspackages.azurecr.io/sagalabs/fdca-intranet-test:${{ github.sha }}|' k8s-deployment-test.yaml

      - uses: azure/setup-kubectl@v2.0

      - name: Azure Login using OIDC
        uses: azure/login@v1.6.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }} # Managed identity client ID
          tenant-id: ${{ secrets.AZURE_TENANT_ID }} # Azure Tenant ID
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} # Azure Subscription ID
          # OIDC is automatically utilized here for authentication

      # Use kubelogin to configure your kubeconfig for Azure auth
      - name: Set up kubelogin for non-interactive login
        uses: azure/use-kubelogin@v1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          kubelogin-version: "latest"

      - name: Set AKS context
        id: set-context
        uses: azure/aks-set-context@v3
        with:
          resource-group: SagaLabs_k8s
          cluster-name: SagaLabs_Dev_Cluster
          admin: "false"
          use-kubelogin: "true"

      - name: Deploy to AKS
        id: deploy-aks
        uses: Azure/k8s-deploy@v4.10.0
        with:
          namespace: "aau"
          manifests: |
            k8s-deployment-test.yaml
